name: Build MGV Editor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        triplet: [x64-windows, x86-windows]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild and Tools
      uses: microsoft/setup-msbuild@v2

    - name: Integrate and Run vcpkg
      run: |
        vcpkg integrate install
        vcpkg install libvorbis\${{ matrix.triplet }}

    - name: Fix Broken CMakeLists
      run: |
        \$content = Get-Content src/MGV_Editor/CMakeLists.txt
        \$newContent = "cmake_minimum_required(VERSION 3.15)`n" + ($content -join "`n")
        Set-Content src/MGV_Editor/CMakeLists.txt \$newContent

    - name: Configure CMake
      run: |
        cmake -B build -S src/MGV_Editor -DCMAKE_TOOLCHAIN_FILE="\(env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=\){{ matrix.triplet }}

    - name: Build Project
      run: |
        cmake --build build --config Release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MGV_Editor-\${{ matrix.triplet }}
        path: |
          build/Release/*.exe
          build/Release/*.dll
        if-no-files-found: warn
