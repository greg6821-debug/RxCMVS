name: Build CMVS Tools

# Полная сборка всех инструментов RxCMVS под Windows x86 (Win32) Release.
# Почему x86:
#  - VFS_Hook / VFS_Extract собираются только при CMAKE_SIZEOF_VOID_P == 4
#    (см. src/VFS_*/CMakeLists.txt и lib/CMVS/CMakeLists.txt).
#  - third/libwebp содержит только 32-битный libwebp.lib, который lib/CMVS
#    линкует безусловно — 64-битная сборка без правок не слинкуется.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win32:
    name: Windows x86 (Win32) — Release
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC x86 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86          # x86 native toolchain -> cl.exe выдаёт 32-битный код

      - name: Configure (preset x86-release)
        run: cmake --preset x86-release

      - name: Build
        run: cmake --build ".build/x86-release" --parallel

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path ".bin/x32/release") {
            Copy-Item ".bin/x32/release/*.exe" artifacts -ErrorAction SilentlyContinue
            Copy-Item ".bin/x32/release/*.dll" artifacts -ErrorAction SilentlyContinue
          }
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CMVS_Tools-x86-release
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
